name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check servers/wikijs-mcp-server

      - name: Type check (mypy)
        run: mypy servers/wikijs-mcp-server --exclude tests

      - name: Run smoke tests
        run: pytest tests/smoke/ -v

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest servers/wikijs-mcp-server/tests -v

  test-windows:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run smoke tests
        run: pytest tests/smoke/ -v

      - name: Run unit tests
        run: pytest servers/wikijs-mcp-server/tests -v
